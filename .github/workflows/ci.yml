name: CI Build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Compilar firmware y software
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Compilar Firmware con PlatformIO
        run: pio run -d Firmware

      - name: Verificar sintaxis de la interfaz grafica
        run: python -m py_compile SoftwareC/Interfaz/interfaz.py